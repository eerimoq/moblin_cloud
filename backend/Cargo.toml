[package]
name = "moblin-cloud-backend"
version = "0.1.0"
edition = "2024"
description = "Backend of Moblin Cloud: the streamers' tip pages, their dashboard and Moblin's connections"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
ciborium = "0.2"
clap = { version = "4", features = ["derive", "env"] }
env_logger = "0.11"
futures-util = "0.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
ring = "0.17"
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1.28.0", features = ["serde", "v4"] }
x509-parser = { version = "0.18", features = ["verify"] }

[dev-dependencies]
tokio-tungstenite = "0.29"

[profile.release]
panic = "unwind"
