services:
  backend:
    image: ghcr.io/eerimoq/moblin_cloud-backend:${VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE: /data/database.sqlite
      PUBLIC_URL: https://${DOMAIN}/api
      FRONTEND_URL: https://${DOMAIN}
    volumes:
      - ./data:/data
  frontend:
    image: ghcr.io/eerimoq/moblin_cloud-frontend:${VERSION:-latest}
    restart: unless-stopped
  caddy:
    image: caddy:2
    restart: unless-stopped
    command: caddy reverse-proxy --from ${DOMAIN} --to frontend:80
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy:/data
volumes:
  caddy:
