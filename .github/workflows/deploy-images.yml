name: Deploy images
on:
  push:
    tags: ["*"]
permissions:
  contents: read
  packages: write
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/publish-image
        with:
          image: backend
          run-options: >-
            --publish 8080:8080
            --env BACKEND_URL=http://localhost:8080
            --env FRONTEND_URL=http://localhost:5173
          test-url: http://localhost:8080/config
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/publish-image
        with:
          image: frontend
          run-options: --publish 8080:80
          test-url: http://localhost:8080
