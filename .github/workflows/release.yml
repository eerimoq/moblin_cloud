name: Release
on:
  push:
    tags: ["*"]
permissions:
  contents: write
  packages: write
jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-${{ matrix.image }}:buildcache,mode=max
  mobtop:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: mobtop
    steps:
      - uses: actions/checkout@v7
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          MOBLIN_CLOUD_VERSION: ${{ github.ref_name }}
      - run: |
          name=mobtop-${{ github.ref_name }}-${{ matrix.target }}
          mkdir "$name"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp target/${{ matrix.target }}/release/mobtop.exe "$name"
            7z a "$name.zip" "$name"
          else
            cp target/${{ matrix.target }}/release/mobtop "$name"
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: mobtop-${{ matrix.target }}
          path: |
            mobtop/mobtop-*.tar.gz
            mobtop/mobtop-*.zip
  release:
    needs: [images, mobtop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: mobtop-*
          merge-multiple: true
          path: assets
      - run: |
          cp deploy/docker-compose.yml assets
          sed "s/^# VERSION=.*/VERSION=$TAG/" deploy/.env.example > assets/env.example
          (cd assets && sha256sum * > SHA256SUMS)
          download="https://github.com/$REPOSITORY/releases/download/$TAG"
          previous=$(git describe --tags --abbrev=0 "$TAG^" 2> /dev/null || true)
          {
            echo "## Docker images"
            echo
            echo "- \`ghcr.io/$REPOSITORY-backend:$TAG\`"
            echo "- \`ghcr.io/$REPOSITORY-frontend:$TAG\`"
            echo
            echo "Run your own copy of this release with [docker-compose.yml]($download/docker-compose.yml) and [env.example]($download/env.example), saved as \`.env\`, as described in [deploy/README.md](https://github.com/$REPOSITORY/blob/$TAG/deploy/README.md)."
            echo
            echo "## mobtop"
            echo
            echo "| Platform | Download |"
            echo "| --- | --- |"
            for target in x86_64-unknown-linux-musl:"Linux x86_64" aarch64-unknown-linux-musl:"Linux ARM64" aarch64-apple-darwin:"macOS Apple silicon" x86_64-apple-darwin:"macOS Intel" x86_64-pc-windows-msvc:"Windows x86_64"; do
              file=$(cd assets && ls "mobtop-$TAG-${target%%:*}".*)
              echo "| ${target#*:} | [$file]($download/$file) |"
            done
            if [ -n "$previous" ]; then
              echo
              echo "## Changes"
              echo
              git log --format='- %s' "$previous..$TAG"
              echo
              echo "**Full changelog**: https://github.com/$REPOSITORY/compare/$previous...$TAG"
            fi
          } > notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md assets/*
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
