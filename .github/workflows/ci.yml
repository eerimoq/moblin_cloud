name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Source code styling
        run: |
          brew install just oxfmt
          just style-check
      - name: Linting
        run: |
          brew install oxlint
          just lint
      - name: Spell checking
        run: |
          brew install codespell
          just spell-check
      - name: Backend tests
        run: just test
